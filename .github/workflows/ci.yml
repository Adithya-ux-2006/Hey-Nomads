name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run build
      # Lint is informational for now: the repo has 9 pre-existing no-unused-vars
      # errors. Tighten this to a hard gate once they are cleared.
      - run: npm run lint
        continue-on-error: true