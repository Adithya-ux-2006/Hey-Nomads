[build]
  base = "frontend-react"
  command = "npm run build"
  publish = "dist"

# The API is a Vercel serverless function (frontend-react/api/index.js). Netlify
# only serves static files, so without this proxy every /api/* call is a 404 and
# nothing on the site can authenticate. This must stay ABOVE the SPA catch-all:
# Netlify applies the first matching rule.
#
# Requests stay same-origin from the browser's point of view, so the JWT in the
# Authorization header is forwarded without any CORS preflight.
[[redirects]]
  from = "/api/*"
  to = "https://hey-nomads.vercel.app/api/:splat"
  status = 200
  force = true

# Everything else is the client-side router: /roommates/12 must serve
# index.html rather than 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200